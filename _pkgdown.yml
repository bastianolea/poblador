url: https://bastianolea.github.io/poblador/
lang: es
template:
  bootstrap: 5
  theme: atom-one-light
  bslib:
    fg: "#51685F"
    bg: "#EFF8E4"
    primary: "#83B397"
project:
  render: ['*.qmd']

authors:
  "Bastián Olea Herrera":
    href: "https://bastianolea.rbind.io"

home:
  links:
  - text: Blog sobre análisis de datos con R
    href: https://bastianolea.rbind.io/blog
  - text: Aprende a programar en R
    href: https://bastianolea.github.io/aprende_r/

reference:
- title: Catálogo de datos
  contents:
  - datos
- title: Tablas de datos de población de Chile
  desc: Datos oficiales de población a nivel de comuna, obtenidos desde el INE
  contents:
  - starts_with("censo")
  - starts_with("mideso")
- title: Agregar población a datos
  desc: Funciones para agregar columnas con población o cifras de población
  contents:
  - starts_with("agregar")
  - starts_with("obtener")

articles:
- title: Artículos
  navbar: ~
  desc: Ejemplos de uso del paquete
  contents:
  - articles/poblacion_nacional
  - articles/poblacion_regional
